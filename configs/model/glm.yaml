# GLM (lasso logistic regression) — single-species SDM.
# Train one species-range with:
#   python scripts/traditional_sdms/sklearn_train.py <start> <end> --config configs/model/glm.yaml
model: glm

use_location: false           
species_ids: all
bg_type: tgb                   # target-group background
seed: 0
train_cap: 10_000
num_workers: 4
skip_existing: true
normalize_predictors: true     

model_params:
  C: 0.01                # lasso strength, lambda = 1/C (grid 0.001/0.01/0.1)
