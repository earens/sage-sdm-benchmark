# Boosted Regression Trees (via LightGBM) — single-species SDM.
# Train one species-range with:
#   python scripts/traditional_sdms/sklearn_train.py <start> <end> --config configs/model/brt.yaml
model: brt

use_location: false           
species_ids: all
bg_type: tgb                   # target-group background
seed: 0
train_cap: 10_000
num_workers: 4
skip_existing: true
normalize_predictors: true     

model_params:
  tc: 3                  # tree complexity -> num_leaves = tc+1 (grid 1/3/5)
