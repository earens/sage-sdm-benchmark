# ─────────────────────────────────────────────────────────────────────────────
# +Aggregation — baseline DeepSDM trained on the 1 km equal-area-aggregated
# occurrences (see configs/paper_runs.yaml).
#
#     python src/main.py --exp aggregation fit
# ─────────────────────────────────────────────────────────────────────────────

data_config: datamodule
model_config: simple_mlp     # SimpleMLP 512x4, BCE (lambda_1=1.0, lambda_2=0.5), uniform weighting

seed_everything: 0
trainer:
  max_epochs: 250
  logger:
    init_args:
      id:

data:
  init_args:
    aggregated: true                 # 1 km-aggregated occurrences
    subsample_indices_file: null     # no subsampling
