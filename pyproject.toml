[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-sdm-benchmark"
version = "0.1.0"
description = "SDM benchmarking framework (SAGE)"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Emilia Arens", email = "emilia.arens@uzh.ch" }]

# Runtime dependencies use lower-bound ranges so the package installs across
# platforms (Linux / macOS / Windows, CPU or GPU) and pip can resolve a working
# set on each — e.g. an Intel Mac auto-resolves to the last torch wheel it has
# (2.2.2). For the exact versions the paper ran on, use requirements-lock.txt.
# Install PyTorch first if you need a specific CUDA/CPU build (see README);
# otherwise pip resolves a default torch wheel here.
dependencies = [
  "torch>=2.2",
  # main.py's `test --ckpt_path` loads checkpoints via a config-built model + trainer
  # restore (bypassing LightningCLI's version-fragile ckpt-hyperparameter parsing), so
  # modern pl works. requirements-lock.txt pins the exact tested stack (pl 2.6.5).
  "pytorch_lightning>=2.2",
  "torchmetrics>=1.3",
  "jsonargparse[signatures]>=4.42",
  "omegaconf>=2.3",
  "PyYAML>=6.0",
  "rootutils>=1.0.7",
  "pyrootutils>=1.0.4",
  # Intel Macs cap at torch 2.2.x (last x86 macOS wheel), which is built against NumPy 1.x;
  # every other platform gets a NumPy-2-compatible torch. Constrain so pip resolves a working set.
  "numpy>=1.26,<2; platform_system == 'Darwin' and platform_machine == 'x86_64'",
  "numpy>=1.26; platform_system != 'Darwin' or platform_machine != 'x86_64'",
  "pandas>=2.0",
  "scipy>=1.11",
  "h5py>=3.10",
  "hdf5plugin>=4.0",
  "matplotlib>=3.7",
  "wandb>=0.16",
  "tqdm>=4.66",
]

# Optional feature groups — install only what you need, e.g.
#   pip install -e ".[baselines]"        # add the traditional single-species models
#   pip install -e ".[maps]"             # add continental prediction maps
#   pip install -e ".[tutorials]"        # add the Jupyter kernel the notebooks need
#   pip install -e ".[all]"              # everything (Python side; R is separate)
# The R packages for MaxEnt / data-prep are NOT pip-installable — see install.R
# or environment-r.yml.
[project.optional-dependencies]
# Traditional single-species baselines: Random Forest, GLM, GAM, BRT.
# scikit-learn is capped below 1.10: the GLM baseline passes penalty="l1" to
# LogisticRegression, which is deprecated from 1.8 and removed in 1.10.
baselines = ["scikit-learn>=1.3,<1.10", "lightgbm>=4.0", "imbalanced-learn>=0.12", "pygam>=0.9", "joblib>=1.3"]
# Continental prediction maps and interactive / exported figures.
maps = ["geopandas>=0.14", "rasterio>=1.3", "shapely>=2.0", "pyproj>=3.5", "plotly>=5.20", "kaleido==0.2.1", "pillow>=10"]
# Rebuild the processed data from raw GBIF (most users download it instead).
dataprep = ["pygbif>=0.6"]
# Run tutorials/*.ipynb: a Jupyter kernel, plus the map stack tutorials 01 and 04 use.
# nbformat is plotly's requirement, not ours: fig.show() renders through plotly's mime
# renderer, which raises "Mime type rendering requires nbformat>=4.2.0" without it.
# Jupyter itself is not pulled in — point an existing Jupyter/VS Code at this kernel.
tutorials = ["sage-sdm-benchmark[maps]", "ipykernel>=6.29", "matplotlib>=3.7", "nbformat>=4.2.0"]
# Tests, debugger, linter.
dev = ["pytest>=8.0", "ipykernel>=6.29", "debugpy>=1.8", "ruff>=0.6"]
all = ["sage-sdm-benchmark[baselines,maps,dataprep,tutorials,dev]"]

# Installed package name is `src` so existing `from src.X import Y` imports
# work both inside this repo (via pyrootutils) and from other projects that
# pip-install it. See README for the tradeoff.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
line-length = 120
# Notebooks are tutorial/paper-figure content, not library code — lint the package instead.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "F",  # pyflakes
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "UP", # pyupgrade
]
# E402: several scripts must call rootutils.setup_root(...) before importing from src.
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# The plotting helpers use compact "ax.set_x(...); ax.set_y(...)" axis-setup lines
# on purpose; E702 there is style, not a defect.
"src/visualizations/property_space.py" = ["E702"]
"src/visualizations/maps/slider.py" = ["E702"]

[tool.pytest.ini_options]
markers = [
    "slow: end-to-end smoke test that runs the real pipeline (deselect with '-m \"not slow\"')",
]

[tool.pyright]
exclude = [
    "**/__pycache__",
    "data",
    "logs"
]
typeCheckingMode = "off"